name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Saas.slnx --configuration Release

      # The integration tests start their own Postgres container (Testcontainers)
      # and host the API and identity service in-process, so they need only
      # Docker: no compose stack, .env or certificates. Postgres stays real
      # because the guarantee most worth testing is row-level security.
      - name: Integration tests
        run: dotnet test src/Saas.Api.Tests --configuration Release --no-build

  web:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/saas-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/saas-web/package-lock.json

      - run: npm ci

      - name: Typecheck
        # Next.js 16 generates the route types (LayoutProps, PageProps) that tsc needs; build does it, tsc alone does not.
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholders: these are read per request at runtime, but the build
          # imports modules that validate their presence.
          AUTH_SECRET: ci_build_placeholder
          AUTH_ISSUER_INTERNAL: http://auth:8080
          API_URL_INTERNAL: http://api:8080
          OIDC_CLIENT_SECRET: ci_build_placeholder

  ai:
    name: AI service lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/saas-ai
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          src: src/saas-ai/app

      - name: Format check
        run: ruff format --check app/
